name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC. Daily: '0 6 * * *'. Monthly: '0 6 1 * *'.
    # GitHub Actions allows no expression here, so this line is the one knob.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Pinned release asset, not the install script. The script needs bash,
      # runs under sh here, and resolved a 404 for the latest tag.
      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: "1.5.1"
        run: |
          curl -sSLf -o /tmp/duckdb.zip             "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          unzip -q -d /usr/local/bin /tmp/duckdb.zip
          duckdb --version

      - name: Pipeline runs end to end
        run: ./demo.sh build

      # demo.sh holds the gate list, so CI and a local check cannot drift apart.
      # After the build, never before it. test_gold.py and test_export.py read
      # the published Parquet and skip when it is missing, so a run before the
      # build reports green with 56 tests that never ran.
      - name: Checks and tests
        run: ./demo.sh check

      - name: Contract reconciles
        run: |
          duckdb warehouse/flightdeck.duckdb -c "
            SELECT CASE WHEN reconciles THEN 'ok' ELSE 'FAIL' END AS status,
                   landed_records, clean_records, quarantined_records
            FROM contract_reconciliation;"
          duckdb warehouse/flightdeck.duckdb -noheader -list -c \
            "SELECT reconciles FROM contract_reconciliation;" | grep -qx true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Exporters build their payloads
        run: ./demo.sh export

      - name: Published Parquet matches the warehouse
        run: python scripts/qa_evidence.py --no-postgres --out docs/qa/ci-check.csv

      # Framework pre-bundles its recommended libraries into client.js on
      # every build, each at @latest, whether or not the site imports them.
      # Restoring its npm cache means the build resolves nothing over the
      # network. resolveNpmVersion reads the directory names here and returns a
      # satisfying version before it asks registry.npmjs.org, and
      # populateNpmCache returns the path it already holds on disk.
      #
      # The key is constant on purpose. It restores on every run and saves only
      # when it misses, so the versions stay put until someone bumps the
      # suffix to ask for a refresh.
      - name: Restore the Framework npm cache
        uses: actions/cache@v6
        with:
          path: site/src/.observablehq/cache/_npm
          key: observable-npm-v1

      # The site loader runs ./demo.sh build itself, so the published pages read
      # the Parquet this run produced.
      #
      # Three attempts. A deploy died on `read ECONNRESET` while the build
      # fetched a package from a CDN, and a re-run with no change fixed it. A
      # shell loop rather than a marketplace action, because a loop adds no
      # dependency.
      - name: Site builds from the pipeline output
        run: |
          npm ci --prefix site
          for attempt in 1 2 3; do
            if npm run build --prefix site; then exit 0; fi
            echo "site build attempt $attempt failed"
            [ "$attempt" = 3 ] || sleep $((attempt * 15))
          done
          exit 1

      # The deploy job publishes this artifact, so the site that goes live is
      # the one this job built and tested.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GitHub Pages needs both. A free personal plan also needs the repository
    # to be public: until then this job fails and the test job still passes.
    permissions:
      pages: write
      id-token: write
    # One deployment at a time. A run in progress finishes rather than being cut off.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement turns Pages on for the repository the first time this runs,
      # so nobody has to find the setting by hand. It needs a repository that
      # can serve Pages at all, which a free account means public.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v5
