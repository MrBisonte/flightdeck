name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Pinned release asset, not the install script. The script needs bash,
      # runs under sh here, and resolved a 404 for the latest tag.
      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: "1.5.1"
        run: |
          curl -sSLf -o /tmp/duckdb.zip             "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          unzip -q -d /usr/local/bin /tmp/duckdb.zip
          duckdb --version

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Credential scan
        run: bash scripts/scan_secrets.sh

      - name: Docs follow Simplified Technical English
        run: python scripts/check_ste.py README.md docs/*.md fixtures/SANITIZATION.md fixtures/reference/README.md

      - name: Fixtures are sanitized
        run: python scripts/sanitize_flightlog.py --check fixtures/raw

      - name: Pipeline runs end to end
        run: ./demo.sh build

      - name: Contract reconciles
        run: |
          duckdb warehouse/flightdeck.duckdb -c "
            SELECT CASE WHEN reconciles THEN 'ok' ELSE 'FAIL' END AS status,
                   landed_records, clean_records, quarantined_records
            FROM contract_reconciliation;"
          duckdb warehouse/flightdeck.duckdb -noheader -list -c \
            "SELECT reconciles FROM contract_reconciliation;" | grep -qx true
