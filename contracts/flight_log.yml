# Data contract for the crow-archer flight log.
#
# Source of truth: docs/playbooks/monitored-playtest.md in the crow-archer
# repository, which documents the wire format the recorder and sink implement.
# The enum members also exist as reference dimensions under fixtures/reference/,
# and tests/test_contract.py asserts the two never drift apart.
#
# Enforcement: pipeline/10_typed.sql. A row that violates any rule below is
# written to the quarantine relation with a reason. Nothing is silently dropped.

version: 1

record_kinds: [hello, beat, alarm, err, bye]

required_fields:
  all:   [kind, srv]
  hello: [wall, href, ua, dpr]
  beat:  [wall, perf, raf, vis, pulse, events]
  alarm: [class, wall, perf, pulse, blockers, trace, events]
  err:   [wall, msg, stack, events]
  bye:   [wall, events]

enums:
  # 15 application states, the values the render dispatch branches on.
  state: [menu, charselect, mapselect, controls, playing, stage_intro,
          boss_entrance, boss_fight, paused, chooser, inventory, talents,
          gameover, win, multiplayer]
  mode: [brawl, waves, siege]
  char: [archer, wizard, knight, ranger, sapper]
  boss: [crowking, dark_archer, dark_knight, minotaur]   # nullable
  alarm_class: [loop-dead, logic-freeze, no-frames]
  trace_level: [off, time, ops]
  visibility: [visible, hidden]
  # The class of the request origin. Derived from hello.href in
  # pipeline/10_typed.sql, never sent on the wire, so version stays at 1.
  # fixtures/reference/origins.csv names the origins themselves, one row each.
  # `unlisted` is what the join produces when no row matches. No reference row
  # carries it, and tests/test_contract.py pins that.
  origin_kind: [local, private, public, masked, unlisted]
  # Frame sections, in the order they run.
  span: [sim, tiles, fog, bodies, vignette, hud]

# Each cap lists every value it has held, oldest first. valid_from is the commit
# that declared the value in this file. To change a cap, give its last entry a
# valid_to and add a new entry that starts there. Never edit a value in place.
caps:
  events_per_beat:              # flight-recorder.ts MAX_EVENTS_PER_BEAT
    - {value: 400, valid_from: "2026-08-31T05:47:22Z"}
  events_per_bye:               # the final drain is the last 100 entries
    - {value: 100, valid_from: "2026-08-31T05:47:22Z"}
  trace_frames:                 # the tracer holds at most 120 frames
    - {value: 120, valid_from: "2026-08-31T05:47:22Z"}
  logger_ring_capacity:         # src/sim/log.ts Logger
    - {value: 500, valid_from: "2026-08-31T05:47:22Z"}
  sink_body_bytes:              # flight-sink.ts MAX_BODY_BYTES
    - {value: 1000000, valid_from: "2026-08-31T05:47:22Z"}

invariants:
  # srv is stamped by the server on arrival, so it is the only clock the page
  # cannot influence. It must be present and must not go backwards within a
  # session file.
  - name: srv_present
    rule: srv IS NOT NULL
  - name: srv_monotonic_per_session
    rule: srv >= lag(srv) within session_id ordered by arrival
  # A page load opens with hello. Records before the first hello are orphans.
  - name: page_load_opens_with_hello
    rule: page_load_seq >= 1
